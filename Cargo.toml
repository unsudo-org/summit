[package]
name = "summit"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dioxus = { version = "=0.6.0", features = ["router", "fullstack"] }
modwire = { version = "=0.1.0" }
kore = { version = ">=0.1.0", git = "https://github.com/unsudo-org/kore.git" }
gloo-timers = { version = "=0.3.0", features = ["futures"] }
wasm-bindgen = { version = "*" }
web-sys = { version = "*" }
fastrand = { version = "*" }
css = { version = "*", path = "css" }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile]
wasm-dev = { inherits = "dev", opt-level = 1 }
server-dev = { inherits = "dev" }
android-dev = { inherits = "dev" }
