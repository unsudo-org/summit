package.name = "summit"
package.version = "0.1.0"
package.edition = "2021"
package.publish = false
dependencies.dioxus.version = "=0.6.0"
dependencies.dioxus.features = ["router", "fullstack"]
dependencies.modwire.version = ">=0.1.0,<1.0.0"
dependencies.once_cell.version = ">=1.0.0,<2.0.0"
dependencies.fastrand.version = "=2.3.0"
dependencies.kore.git = "https://github.com/unsudo-org/kore.git"
dependencies.gloo-timers.version = "0.3.0"
dependencies.gloo-timers.features = ["futures"]
dependencies.wasm-bindgen.version = "*"
dependencies.web-sys.version = "*"
features.default = ["web"]
features.web = ["dioxus/web"]
features.desktop = ["dioxus/desktop"]
features.mobile = ["dioxus/mobile"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
